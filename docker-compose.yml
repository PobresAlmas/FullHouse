services:
  postgres:
    image: postgres:18.1-alpine
    container_name: fullhouse-postgres
    environment:
      POSTGRES_USER: fullhouse
      POSTGRES_PASSWORD: fullhouse123
      POSTGRES_DB: fullhouse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: docker.io/pgsty/silo
    container_name: fullhouse-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: fullhouse
      MINIO_ROOT_PASSWORD: fullhouse123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data:
